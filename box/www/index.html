<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanYourTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;600&display=swap" rel="stylesheet">
<!-- CleanYourTV (MIT): Pitch-black #000000 canvas, top shelf with ambient glow,
     dock band, one floating glass highlight, zero bloat, native remote navigation. -->
<style>
:root {
  --bg: #000000;
  --text: #f5f5f7;
  --dim: rgba(245, 245, 247, 0.62);
  --fill: rgba(255, 255, 255, 0.07);
  --edge: rgba(255, 255, 255, 0.14);
  --spring: cubic-bezier(0.34, 1.45, 0.64, 1);
  --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; outline: none !important; }
html, body {
  height: 100%;
  width: 100%;
  background: #000000;
  overflow: hidden;
  color: var(--text);
  font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  user-select: none;
}
#stage {
  position: fixed;
  inset: 0;
  width: 1920px;
  height: 1080px;
  background: var(--bg);
  overflow: hidden;
}
#glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#glow div {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#glow div.on { opacity: 0.45; }
#content {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
}
#hello {
  position: absolute;
  left: 96px;
  top: 64px;
}
#greet {
  font-size: 30px;
  color: var(--dim);
}
#time {
  font-size: 120px;
  font-weight: 200;
  line-height: 1.05;
  letter-spacing: -2px;
  color: #ffffff;
}
#date {
  font-size: 24px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 4px;
}
#shelf {
  position: absolute;
  left: 96px;
  top: 400px;
  max-width: 1500px;
  transition: opacity 0.2s ease;
}
#st {
  font-size: 92px;
  font-weight: 600;
  letter-spacing: -1.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #ffffff;
}
#sc {
  font-size: 30px;
  color: var(--dim);
  margin-top: 8px;
}
#band {
  position: absolute;
  left: 96px;
  top: 600px;
  display: flex;
  gap: 20px;
  padding: 20px;
  border-radius: 56px;
  background: var(--fill);
  border: 1px solid var(--edge);
}
.dtile {
  position: relative;
  width: 220px;
  height: 124px;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.07);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.3s var(--spring);
}
.dtile svg {
  width: 44px;
  height: 44px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.dtile.focus {
  transform: translateY(-6px) scale(1.05);
}
/* One single floating glass highlight that springs between tiles */
#glass {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  border-radius: 36px;
  pointer-events: none;
  opacity: 0;
  z-index: 2;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.07));
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  transition: transform 0.42s var(--spring), width 0.42s var(--spring), height 0.42s var(--spring), opacity 0.2s;
}
#glass.nt { transition: none !important; }
#top {
  position: absolute;
  right: 96px;
  top: 56px;
  display: flex;
  gap: 16px;
  z-index: 5;
}
.pill {
  height: 64px;
  padding: 0 34px;
  border-radius: 32px;
  display: flex;
  align-items: center;
  font-size: 26px;
  background: var(--fill);
  border: 1px solid var(--edge);
  color: var(--text);
  cursor: pointer;
  transition: transform 0.25s var(--spring), background 0.2s;
}
.pill.focus {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.5);
  transform: scale(1.06);
}
#hint {
  position: absolute;
  left: 96px;
  bottom: 36px;
  font-size: 20px;
  color: var(--dim);
  transition: opacity 1s;
  z-index: 10;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="stage">
  <div id="glow"><div></div><div></div></div>
  <div id="content">
    <div id="hello"><div id="greet"></div><div id="time"></div><div id="date"></div></div>
    <div id="shelf"><div id="st"></div><div id="sc"></div></div>
    <div id="band"></div>
    <div id="glass"></div>
  </div>
  <div id="top"></div>
  <div id="hint">Arrows move &middot; OK selects &middot; EXIT returns home</div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (t, c, x) => {
    const e = document.createElement(t);
    if (c) e.className = c;
    if (x != null) e.textContent = x;
    return e;
  };
  const content = $("#content"), glass = $("#glass"), bandEl = $("#band"), topEl = $("#top");

  const ICONS = {
    yt: '<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"/>',
    cinejoy: '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>',
    vidbinge: '<rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>',
    google: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'
  };

  const dock = [
    { id: "youtube", title: "YouTube", caption: "10-Foot 4K TV Interface \u00b7 Ad-Free \u00b7 HD Thumbnails", hue: 0, glow: "rgba(239, 68, 68, 0.45)", icon: "yt", url: "https://www.youtube.com/tv" },
    { id: "cinejoy", title: "Cinejoy", caption: "Movies & Series \u00b7 4K Streams \u00b7 Subtitles", hue: 280, glow: "rgba(168, 85, 247, 0.45)", icon: "cinejoy", url: "https://cinejoy.pk/" },
    { id: "vidbinge", title: "VidBinge", caption: "Cinema UI \u00b7 Fast Streaming \u00b7 Auto-Captions", hue: 35, glow: "rgba(245, 158, 11, 0.45)", icon: "vidbinge", url: "https://vidbinge.com/" },
    { id: "google", title: "Google Web", caption: "Search the global web and open websites", hue: 210, glow: "rgba(56, 189, 248, 0.45)", icon: "google", url: "https://www.google.com/" }
  ];

  const TOP = [
    { id: "inputs", label: "Inputs" },
    { id: "net", label: "Wi-Fi \u00b7 4K60" },
    { id: "settings", label: "Settings" }
  ];

  let topEls = [], dockEls = [], f = { z: "dock", c: 0 }, last = { top: 0, dock: 0 }, sk = "", gcur = 0;

  function build() {
    topEl.innerHTML = "";
    bandEl.innerHTML = "";
    topEls = TOP.map((t, idx) => {
      const e = el("div", "pill", t.label);
      e.onclick = () => { f = { z: "top", c: idx }; render(); activate(); };
      topEl.append(e);
      return e;
    });
    dockEls = dock.map((d, idx) => {
      const e = el("div", "dtile");
      e.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[d.icon] + '</svg>';
      e.append(el("span", "", d.title));
      e.onclick = () => { f = { z: "dock", c: idx }; render(); activate(); };
      bandEl.append(e);
      return e;
    });
  }

  function pos(e) {
    let x = 0, y = 0;
    while (e && e !== content) {
      x += e.offsetLeft;
      y += e.offsetTop;
      e = e.offsetParent;
    }
    return { x, y };
  }

  function setGlow(c) {
    const g = [...document.querySelectorAll("#glow div")];
    if (g[gcur].dataset.c === c) return;
    const n = gcur ^ 1;
    g[n].dataset.c = c;
    g[n].style.background = `radial-gradient(1100px 750px at 30% 36%, ${c}, transparent 70%)`;
    g[n].classList.add("on");
    g[gcur].classList.remove("on");
    gcur = n;
  }

  function setShelf(t, c) {
    const k = t + "|" + c;
    if (k === sk) return;
    sk = k;
    const s = $("#shelf");
    s.style.opacity = 0;
    setTimeout(() => {
      $("#st").textContent = t;
      $("#sc").textContent = c;
      s.style.opacity = 1;
    }, 120);
  }

  function render(first) {
    document.querySelectorAll(".focus").forEach(e => e.classList.remove("focus"));
    const e = f.z === "top" ? topEls[f.c] : dockEls[f.c];
    if (!e) return;
    const it = f.z === "dock" ? dock[f.c] : null;
    e.classList.add("focus");

    if (f.z === "top") {
      glass.style.opacity = 0;
    } else {
      if (first) glass.classList.add("nt");
      const p = pos(e), m = 12;
      glass.style.transform = `translate(${p.x - m}px, ${p.y - m}px)`;
      glass.style.width = (e.offsetWidth + 2 * m) + "px";
      glass.style.height = (e.offsetHeight + 2 * m) + "px";
      glass.style.opacity = 1;
      if (first) requestAnimationFrame(() => requestAnimationFrame(() => glass.classList.remove("nt")));
    }
    if (it) {
      setGlow(it.glow);
      setShelf(it.title, it.caption || "");
    }
  }

  function move(d) {
    if (f.z === "top") {
      if (d === "l") f.c = Math.max(0, f.c - 1);
      else if (d === "r") f.c = Math.min(TOP.length - 1, f.c + 1);
      else if (d === "d") { last.top = f.c; f.z = "dock"; f.c = last.dock; }
    } else {
      if (d === "l") f.c = Math.max(0, f.c - 1);
      else if (d === "r") f.c = Math.min(dock.length - 1, f.c + 1);
      else if (d === "u") { last.dock = f.c; f.z = "top"; f.c = last.top; }
    }
    render();
  }

  function activate() {
    if (f.z === "top") {
      const t = TOP[f.c];
      if (t.id === "settings") {
        window.location.href = "https://www.google.com/";
      }
    } else {
      const it = dock[f.c];
      if (it && it.url) window.location.href = it.url;
    }
  }

  function updateClock() {
    const d = new Date(), h = d.getHours();
    const g = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    const tm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const dt = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    $("#greet").textContent = g;
    $("#time").textContent = tm;
    $("#date").textContent = dt;
  }

  const KEYS = {
    ArrowUp: "u", ArrowDown: "d", ArrowLeft: "l", ArrowRight: "r",
    Enter: "ok", " ": "ok", Escape: "back", Backspace: "back"
  };

  function back() {
    if (f.z === "top") {
      f.z = "dock";
      f.c = last.dock;
      render();
    }
  }

  window.addEventListener("keydown", ev => {
    const k = KEYS[ev.key];
    if (!k) return;
    ev.preventDefault();
    if (k === "ok") activate();
    else if (k === "back") back();
    else move(k);
  });

  build();
  updateClock();
  render(true);
  setInterval(updateClock, 15000);
})();
</script>
</body>
</html>
